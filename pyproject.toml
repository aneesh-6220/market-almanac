[project]
name = "market-almanac"
version = "1.0.0"
description = "Open-source econometric forecasting of food-price risk from environmental and economic signals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "Market Almanac contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "duckdb>=1.0",
  "statsmodels>=0.14.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "threadpoolctl>=3.5",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "pyyaml>=6.0.3",
]

[project.scripts]
market-almanac = "market_almanac.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil",
]
geo = [
    "rasterio>=1.5.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/market-almanac/src/market_almanac", "apps/api/src/market_almanac_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
  "live: performs real network requests against external providers (credential/network gated)",
]
filterwarnings = ["ignore::DeprecationWarning:statsmodels.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages/market-almanac/src", "apps/api/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001/RUF002: mathematical symbols (−, ×, σ) in docstrings and labels are intentional.
ignore = ["B008", "RUF001", "RUF002", "RUF012", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Markdown table templates in the research report are clearer on one line each.
"packages/market-almanac/src/market_almanac/workbench/package.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
mypy_path = ["packages/market-almanac/src", "apps/api/src"]
packages = ["market_almanac", "market_almanac_api"]

[tool.vercel]
entrypoint = "apps.api.src.market_almanac_api.main:app"