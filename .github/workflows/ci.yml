name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    env:
      MARKET_ALMANAC_MODE: demo
      DATABASE_URL: sqlite:///./data/market-almanac.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=market_almanac --cov=market_almanac_api --cov-report=term
      - name: Research specifications validate
        run: for f in docs/research/specs/*.yaml; do uv run market-almanac research validate "$f"; done
      - name: Packaged registry and study summaries are valid JSON
        run: |
          for f in packages/market-almanac/src/market_almanac/globaldata/*.json packages/market-almanac/src/market_almanac/research/published/*.json; do
            [ -e "$f" ] || continue
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

  global-data:
    name: Global price data (pinned release, real observations)
    runs-on: ubuntu-latest
    env:
      MARKET_ALMANAC_MODE: live
      DATA_DIR: ${{ github.workspace }}/.real-data
      MARKET_ALMANAC_REAL_DATA_DIR: ${{ github.workspace }}/.real-data
      DATABASE_URL: sqlite:///./.real-data/api.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Install the pinned data-only price artefact (SHA-256 verified)
        run: uv run market-almanac global install-prices
      - name: Journeys over 3.8 million archived observations, 95 countries
        run: uv run pytest tests/integration/test_global_prices_real.py -q -p no:cacheprovider

  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: End-to-end (demo mode)
    runs-on: ubuntu-latest
    needs: [python, web]
    env:
      MARKET_ALMANAC_MODE: demo
      DATABASE_URL: sqlite:///./data/market-almanac.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run market-almanac db-init && uv run market-almanac demo-seed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t market-almanac-api .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t market-almanac-web .
